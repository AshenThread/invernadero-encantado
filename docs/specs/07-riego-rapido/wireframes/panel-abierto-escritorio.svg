<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="system-ui, sans-serif">
  <rect width="1280" height="640" fill="#F2F2F2"/>
  <rect width="1280" height="48" fill="#D9D9D9"/>
  <text x="24" y="30" font-size="14" fill="#212121">Panel abierto · CA-1.8.2</text>

  <text x="24" y="92" font-size="24" fill="#212121" font-weight="700">Plantas</text>
  <text x="24" y="132" font-size="20" fill="#212121" font-weight="700">Lista de plantas</text>

  <rect x="24" y="152" width="1232" height="44" fill="#616161"/>
  <text x="40" y="180" font-size="14" fill="#FFFFFF" font-weight="700">Nombre</text>
  <text x="280" y="180" font-size="14" fill="#FFFFFF" font-weight="700">Especie</text>
  <text x="560" y="180" font-size="14" fill="#FFFFFF" font-weight="700">Ubicación</text>
  <text x="760" y="180" font-size="14" fill="#FFFFFF" font-weight="700">Riego cada</text>
  <text x="980" y="180" font-size="14" fill="#FFFFFF" font-weight="700">Acción</text>

  <!-- Fila Mandrágora -->
  <rect x="24" y="196" width="1232" height="56" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="40" y="230" font-size="16" fill="#212121">Mandrágora</text>
  <text x="280" y="230" font-size="14" fill="#616161">Mandragora officinarum</text>
  <text x="560" y="230" font-size="14" fill="#616161">Mesa 2</text>
  <text x="760" y="230" font-size="14" fill="#616161">3 días</text>
  <rect x="980" y="208" width="100" height="32" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="1004" y="229" font-size="14" fill="#212121">Regar</text>

  <!-- Panel bajo la fila -->
  <rect x="24" y="252" width="1232" height="140" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="40" y="284" font-size="16" fill="#212121" font-weight="700">Riego rápido</text>
  <text x="40" y="316" font-size="14" fill="#212121">Cantidad (ml)</text>
  <rect x="40" y="328" width="200" height="40" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1"/>
  <text x="52" y="354" font-size="16" fill="#212121">500</text>
  <rect x="260" y="328" width="150" height="40" fill="#616161"/>
  <text x="280" y="354" font-size="16" fill="#FFFFFF">Guardar riego</text>
  <rect x="424" y="328" width="120" height="40" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="448" y="354" font-size="16" fill="#212121">Cancelar</text>

  <!-- Fila Aconito -->
  <rect x="24" y="392" width="1232" height="56" fill="#FFFFFF" stroke="#D9D9D9"/>
  <text x="40" y="426" font-size="16" fill="#212121">Aconito</text>
  <text x="280" y="426" font-size="14" fill="#616161">Aconitum napellus</text>
  <text x="560" y="426" font-size="14" fill="#616161">Mesa 1</text>
  <text x="760" y="426" font-size="14" fill="#616161">2 días</text>
  <rect x="980" y="404" width="100" height="32" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="1004" y="425" font-size="14" fill="#212121">Regar</text>
</svg>
