<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 900" font-family="system-ui, sans-serif">
  <rect width="390" height="900" fill="#F2F2F2"/>
  <rect width="390" height="48" fill="#D9D9D9"/>
  <text x="16" y="30" font-size="14" fill="#212121">Panel abierto · CA-1.8.2, CA-1.8.7</text>

  <text x="16" y="84" font-size="24" fill="#212121" font-weight="700">Plantas</text>
  <text x="16" y="120" font-size="20" fill="#212121" font-weight="700">Lista de plantas</text>

  <!-- Tarjeta Mandrágora + panel -->
  <rect x="16" y="140" width="358" height="360" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
  <text x="28" y="168" font-size="16" fill="#212121" font-weight="700">Mandrágora</text>
  <text x="28" y="192" font-size="14" fill="#616161">Mesa 2 · cada 3 días</text>
  <rect x="28" y="208" width="100" height="32" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="52" y="229" font-size="14" fill="#212121">Regar</text>

  <!-- Panel -->
  <line x1="28" y1="256" x2="362" y2="256" stroke="#D9D9D9" stroke-width="1"/>
  <text x="28" y="284" font-size="16" fill="#212121" font-weight="700">Riego rápido</text>
  <text x="28" y="316" font-size="14" fill="#212121">Cantidad (ml)</text>
  <rect x="28" y="328" width="318" height="40" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1"/>
  <text x="40" y="354" font-size="16" fill="#212121">500</text>

  <rect x="28" y="388" width="150" height="44" fill="#616161"/>
  <text x="48" y="416" font-size="16" fill="#FFFFFF">Guardar riego</text>
  <rect x="190" y="388" width="120" height="44" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="214" y="416" font-size="16" fill="#212121">Cancelar</text>

  <!-- Otra tarjeta (sin panel: solo uno a la vez) -->
  <rect x="16" y="520" width="358" height="120" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
  <text x="28" y="548" font-size="16" fill="#212121" font-weight="700">Aconito</text>
  <text x="28" y="576" font-size="14" fill="#616161">Mesa 1 · cada 2 días</text>
  <rect x="28" y="592" width="100" height="32" fill="#FFFFFF" stroke="#616161" stroke-width="2"/>
  <text x="52" y="613" font-size="14" fill="#212121">Regar</text>
</svg>
